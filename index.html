<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="wowCC1vk5JXrHIuF7GdIvnHV44uJFh-zzYTc41fr1Q0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
    <script src="/theme-init.js"></script>

    <!-- Primary meta -->
    <title>ArcheSpace | Everything in One Encrypted Space</title>
    <meta name="description" content="An open-source, zero-knowledge encrypted space to capture and organise your notes, projects, secrets, code, checklists and ideas, synced across all your devices." />
    <meta name="author" content="ArcheSpace" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="{{SITE_URL}}/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ArcheSpace" />
    <meta property="og:title" content="ArcheSpace | Everything in One Encrypted Space" />
    <meta property="og:description" content="An open-source, zero-knowledge encrypted space to capture and organise your notes, projects, secrets, code, checklists and ideas, synced across all your devices." />
    <meta property="og:url" content="{{SITE_URL}}/" />
    <meta property="og:image" content="{{SITE_URL}}/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ArcheSpace | Everything in One Encrypted Space" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArcheSpace | Everything in One Encrypted Space" />
    <meta name="twitter:description" content="An open-source, zero-knowledge encrypted space to capture and organise your notes, projects, secrets, code, checklists and ideas, synced across all your devices." />
    <meta name="twitter:image" content="{{SITE_URL}}/og-image.png" />

    <!-- PWA basics -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ArcheSpace" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ArcheSpace",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web",
      "description": "An open-source, zero-knowledge encrypted space to capture and organise your notes, projects, secrets, code, checklists and ideas, synced across all your devices.",
      "url": "{{SITE_URL}}/",
      "image": "{{SITE_URL}}/og-image.png",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": {
        "@type": "Organization",
        "name": "ArcheSpace",
        "url": "https://github.com/wyserian/archespace"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
